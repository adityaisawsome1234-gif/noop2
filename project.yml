# XcodeGen spec for the Forma iOS app.
#   brew install xcodegen      # one-time, on your Mac
#   xcodegen generate          # run in this folder; creates Forma.xcodeproj
# See docs/BUILD_AND_INSTALL.md for signing and installing on your iPhone.
name: Forma
options:
  bundleIdPrefix: com.example.forma        # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                   # set your Team in Xcode (Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic
packages:
  FormaKit:
    path: FormaKit
targets:
  Forma:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Forma
        excludes:
          - "**/*.md"
    dependencies:
      - package: FormaKit
        product: FormaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.forma.app
        PRODUCT_NAME: Forma
        INFOPLIST_FILE: App/Forma/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # The app target uses Swift 5 language mode with complete concurrency checking reported as
        # warnings; FormaKit itself is built in Swift 6 language mode (strict, verified on Linux).
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
schemes:
  Forma:
    build:
      targets:
        Forma: all
    run:
      config: Debug
    test:
      config: Debug
